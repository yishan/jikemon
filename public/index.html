<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>宝可即图鉴 · Pokéji</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700;900&family=M+PLUS+Rounded+1c:wght@700;900&display=swap"
    rel="stylesheet"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="stage">
    <header class="masthead">
      <a class="pokeball" href="https://web.pokeji.com/" aria-label="返回首页"></a>
      <h1>宝可即图鉴</h1>
      <p class="sub">POKÉJI · 把你的即刻主页变成专属卡牌</p>
    </header>

    <form id="form" class="seeker">
      <input
        id="input"
        type="text"
        placeholder="请输入即刻主页链接..."
        spellcheck="false"
      />
      <div class="seeker-loading" role="status" aria-live="polite">
        <span class="seeker-loading__bar" aria-hidden="true"></span>
        <span class="catch-ball" aria-hidden="true"></span>
        <span class="seeker-loading__text">精灵球正在捕捉中</span>
      </div>
    </form>

    <p id="status" class="status" hidden></p>

    <main id="arena" class="arena">
      <div class="card-tilt" id="tilt">
        <article class="card" id="card"><!-- 占位卡 / 真卡由 app.js 渲染 --></article>
        <button type="button" id="openBtn" class="open-btn">捕捉</button>
      </div>

      <aside class="dossier" id="dossier" hidden><!-- 评分说明由 app.js 渲染 --></aside>
    </main>

    <div class="actions" id="actions" hidden>
      <button id="duelEntryBtn" class="duel-entry-btn" type="button">宝可即对战 ⚔️</button>
      <div class="export-group" id="exportGroup">
        <button id="download">导出卡牌</button>
        <button
          id="exportMenuBtn"
          class="export-menu-btn"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
          aria-label="更多导出选项"
        >▾</button>
        <div class="export-menu" id="exportMenu" hidden>
          <button type="button" data-export-action="copy-image">
            复制卡牌
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="7" width="11" height="14" rx="2" />
              <path d="M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2" />
            </svg>
          </button>
          <button type="button" data-export-action="copy-link">
            复制链接
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
            </svg>
          </button>
          <button type="button" data-export-action="export-image">
            导出图鉴
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
          </button>
          <button type="button" data-export-action="export-card-back">
            导出卡牌背面
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="3" width="16" height="18" rx="2" />
              <path d="M8 8h8M8 12h8M8 16h5" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <footer class="colophon">
      <p class="brand">
        POKEJI.COM © 2026 · Build by
        <a href="https://web.okjike.com/u/9db4da53-3af2-4214-ab41-7a2a9930685a" target="_blank" rel="noreferrer">@yishan</a>
      </p>
      <p class="disclaimer">
        规则灵感来自 <a href="https://github.com/Younesfdj/gitfut" target="_blank" rel="noreferrer">gitfut</a> · 卡面致敬 Pokémon TCG。本站由非官方粉丝创作，与即刻官方及 The Pokémon Company 均无关联，仅供娱乐，站点所用数据来自即刻用户公开主页。
      </p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
